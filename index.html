<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brösel's Gramophone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3ead8; --card:#fffaf0; --ink:#3b2a20; --soft:#7a6553; --line:#e1d3b9; --accent:#c8743a; --accent-ink:#fff;
  --sky-day:#9fd3ea; --sky-dusk:#e9a07a; --sky-night:#1d2540;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#161a24; --card:#1f2431; --ink:#efe4d2; --soft:#a99c8a; --line:#323a4c; --accent:#e08a4b; --accent-ink:#1a1206; }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:16px}
.card{width:min(440px,100%);background:var(--card);border:2px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:0 10px 30px rgb(0 0 0/.12)}
canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;background:var(--sky-day)}
.body{padding:16px 18px 18px}
h1{font:600 22px/1.1 "Pixelify Sans",system-ui,sans-serif;margin:0 0 2px}
.sub{color:var(--soft);font-size:14px;margin:0 0 14px}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
button.play{font:600 17px "Pixelify Sans",system-ui,sans-serif;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:10px 18px;cursor:pointer;min-width:120px}
button.play:focus-visible,.seg button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
label.vol{display:flex;align-items:center;gap:8px;flex:1;min-width:150px;color:var(--soft);font-size:14px}
input[type=range]{flex:1;accent-color:var(--accent)}
.seg{display:flex;border:2px solid var(--line);border-radius:10px;overflow:hidden;margin-top:14px}
.seg button{flex:1;background:none;border:0;color:var(--ink);padding:8px 4px;font:15px "Pixelify Sans",system-ui,sans-serif;cursor:pointer}
.seg button+button{border-left:2px solid var(--line)}
.seg button[aria-pressed=true]{background:var(--accent);color:var(--accent-ink)}
.hint{color:var(--soft);font-size:14px}
.now{margin:12px 0 0;font-size:14px;color:var(--soft);min-height:1.4em}
</style>
</head>
<body>
<main class="card">
  <canvas id="scene" width="160" height="90" aria-hidden="true"></canvas>
  <div class="body">
    <h1>Brösel's Gramophone</h1>
    <p class="sub">The same tune that plays in his village, made up as it goes, so it never repeats exactly. It keeps playing when you leave the page or lock your phone.</p>
    <div class="row">
      <button class="play" id="play" aria-pressed="false">▶ Play</button>
      <label class="vol" id="volWrap">Volume <input id="vol" type="range" min="0" max="100" value="60"></label>
      <span class="hint" id="volHint" hidden>Use your phone’s volume buttons</span>
    </div>
    <div class="seg" role="group" aria-label="Time of day">
      <button data-mood="auto" aria-pressed="true">Clock</button>
      <button data-mood="day" aria-pressed="false">Day</button>
      <button data-mood="dusk" aria-pressed="false">Dusk</button>
      <button data-mood="night" aria-pressed="false">Night</button>
    </div>
    <p class="now" id="now" aria-live="polite"></p>
    <audio id="player" preload="auto" playsinline></audio>
  </div>
</main>
<script>
/* =====================================================================
   Brösel's music engine. To keep playing in the background (Safari on iPhone
   pauses live Web Audio when you leave), the tune is composed a few minutes
   ahead into short recordings that a normal <audio> player plays one after
   another. Normal audio players are allowed to keep going in the background
   and show up on the lock screen.
   ===================================================================== */
function hashStr(s){ let h=2166136261; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return h>>>0; }
function rnd(k){ let t=(hashStr(k)+0x6D2B79F5)>>>0; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }
const PENT=[0,2,4,7,9];
const PROG={day:[[0,4,7],[9,12,16],[5,9,12],[7,11,14]], dusk:[[9,12,16],[5,9,12],[0,4,7],[7,11,14]], night:[[9,12,16],[5,9,12],[0,4,7],[4,7,11]]};
const BPM={day:84,dusk:72,night:56};
const hz=m=>440*Math.pow(2,(m-69)/12);
const SR=32000, FIRST_SEC=40, CHUNK_SEC=180, AHEAD=3;
const session=Math.random().toString(36).slice(2);

let choice='auto';
function moodAt(date){ const h=date.getHours()+date.getMinutes()/60; if(h>=23||h<7) return 'night'; if(h>=17.5||h<8) return 'dusk'; return 'day'; }

/* composer state carries over from one recording to the next */
const comp={bar:0,step:0,last:72};

async function renderChunk(seconds,startWall,fixedMood,vol){
  const len=Math.ceil((seconds+1.4)*SR);
  const ctx=new OfflineAudioContext(1,len,SR);
  const master=ctx.createGain(), out=ctx.createGain(); out.gain.value=.8*vol;
  const lp=ctx.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3400;
  const d1=ctx.createDelay(); d1.delayTime.value=.33; const fb=ctx.createGain(); fb.gain.value=.3; const wet=ctx.createGain(); wet.gain.value=.26;
  master.connect(lp); lp.connect(out); lp.connect(d1); d1.connect(fb); fb.connect(d1); d1.connect(wet); wet.connect(out);
  const fade=ctx.createGain(); out.connect(fade); fade.connect(ctx.destination);
  fade.gain.setValueAtTime(0,0); fade.gain.linearRampToValueAtTime(1,.08); fade.gain.setValueAtTime(1,len/SR-.15); fade.gain.linearRampToValueAtTime(0,len/SR);
  function tone(freq,t,dur,{type='sine',v=.2,attack=.01,release=.4,detune=0}={}){
    const o=ctx.createOscillator(), g=ctx.createGain(); o.type=type; o.frequency.value=freq; o.detune.value=detune;
    g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v,t+attack); g.gain.exponentialRampToValueAtTime(.0001,t+dur+release);
    o.connect(g); g.connect(master); o.start(t); o.stop(Math.min(t+dur+release+.05,len/SR)); }
  const musicbox=(m,t,v)=>{ const f=hz(m); tone(f,t,.05,{v,attack:.004,release:.9}); tone(f*2,t,.02,{v:v*.25,attack:.004,release:.35}); };
  const pad=(chord,t,l,v)=>{ for(const n of chord){ tone(hz(48+n),t,l*.6,{type:'triangle',v:v/chord.length,attack:l*.3,release:l*.5,detune:-6}); tone(hz(48+n),t,l*.6,{v:v*.6/chord.length,attack:l*.3,release:l*.5,detune:7}); } };

  const events=[], moods=[]; let t=.05, mood=fixedMood||moodAt(new Date(startWall));
  while(true){
    const beat=comp.step%8;
    if(beat===0){
      mood=fixedMood||moodAt(new Date(startWall+t*1000));
      const barLen=8*60/BPM[mood]/2; if(t+barLen>seconds) break;     // only whole bars per recording
      moods.push({t,mood});
      const chord=PROG[mood][comp.bar%4];
      pad(chord,t,barLen,mood==='night'?.09:.11);
      tone(hz(36+chord[0]),t,barLen*3/8,{v:mood==='night'?.08:.12,attack:.02,release:.6});
      if(mood!=='night') tone(hz(36+chord[0]+7),t+barLen/2,barLen/4,{v:.07,attack:.02,release:.5});
    }
    const spb=60/BPM[mood]/2, chord=PROG[mood][comp.bar%4];
    const density=mood==='day'?.62:mood==='dusk'?.45:.28;
    const seed=rnd('mel:'+session+':'+comp.bar+':'+comp.step);
    if(seed<density&&!(mood==='night'&&beat%2)){
      const pool=[]; for(const o of [60,72]) for(const s of PENT) pool.push(o+s); pool.push(...chord.map(c=>c+72));
      const tones=seed<density*.35?chord.map(c=>c+72):(()=>{ const nr=pool.filter(m=>Math.abs(m-comp.last)<=5); return nr.length?nr:pool; })();
      const m=tones[Math.floor(rnd('n:'+session+':'+comp.bar+':'+comp.step)*tones.length)];
      comp.last=m; musicbox(m,t,mood==='night'?.07:.1); events.push({t,m});
    }
    comp.step++; if(comp.step%8===0) comp.bar++; t+=spb;
  }
  const buf=await ctx.startRendering();
  return {url:URL.createObjectURL(wav(buf.getChannelData(0))),events,moods,dur:len/SR,startWall};
}
function wav(f){ const n=f.length, b=new ArrayBuffer(44+n*2), v=new DataView(b); const w=(o,s)=>{ for(let i=0;i<s.length;i++) v.setUint8(o+i,s.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4,36+n*2,true); w(8,'WAVE'); w(12,'fmt '); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,SR,true); v.setUint32(28,SR*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); w(36,'data'); v.setUint32(40,n*2,true);
  for(let i=0;i<n;i++){ const x=Math.max(-1,Math.min(1,f[i])); v.setInt16(44+i*2,x*32767,true); } return new Blob([b],{type:'audio/wav'}); }

/* ---------- the player: plays recordings back to back, composes ahead ---------- */
const audio=document.getElementById('player');
let queue=[], current=null, on=false, busy=false, gen=0, vol=.6, nativeVolume=true;
let plannedEnd=Date.now();   // wall-clock time when everything composed so far will have finished playing

async function fill(){
  if(busy) return; busy=true; const my=gen;
  try{
    while(my===gen&&queue.length<AHEAD){
      const first=!current&&!queue.length, secs=first?FIRST_SEC:CHUNK_SEC;
      const start=Math.max(plannedEnd,Date.now());
      const c=await renderChunk(secs,start,choice==='auto'?null:choice,nativeVolume?1:vol);
      if(my!==gen){ URL.revokeObjectURL(c.url); break; }
      queue.push(c); plannedEnd=start+c.dur*1000;
      if(on&&!current) playNext();
    }
  } finally { busy=false; }
  if(my!==gen) fill();
}
function playNext(){
  if(current) URL.revokeObjectURL(current.url);
  current=queue.shift()||null;
  if(!current){ fill(); return; }
  audio.src=current.url; audio.play().catch(()=>{}); seen=0; fill(); ui();
}
audio.addEventListener('ended',()=>{ if(!on) return; if(queue.length) playNext(); else { audio.currentTime=0; audio.play().catch(()=>{}); } });   // never go silent: replay if the next one isn't ready
audio.addEventListener('pause',()=>{ if(on&&!audio.ended&&document.visibilityState==='visible'&&!switching) { on=false; ui(); } });
audio.addEventListener('play',()=>{ if(!on){ on=true; ui(); } });

let switching=false;
function restartComposition(){                 // new style chosen: throw away what was composed ahead and start fresh
  gen++; for(const c of queue) URL.revokeObjectURL(c.url); queue=[]; plannedEnd=Date.now();
  if(on){ switching=true; const keep=current; current=null; fill().then(()=>{ switching=false; }); if(keep) setTimeout(()=>URL.revokeObjectURL(keep.url),5000); }
  else { if(current){ URL.revokeObjectURL(current.url); current=null; } fill(); }
}
async function start(){
  on=true; ui();
  if(current){ audio.play().catch(()=>{}); return; }
  // unlock the player inside the tap (Safari needs that), then start the first recording
  if(!queue.length){ audio.src=SILENCE; audio.play().catch(()=>{}); }
  if(queue.length) playNext(); else fill();
}
function stop(){ on=false; audio.pause(); ui(); }
const SILENCE=URL.createObjectURL(wav(new Float32Array(SR/4)));

/* ---------- lock screen / control centre ---------- */
function mediaSession(){
  if(!('mediaSession' in navigator)) return;
  const m=current?.moods?.[0]?.mood||moodAt(new Date());
  try{ navigator.mediaSession.metadata=new MediaMetadata({title:{day:'Sunny day',dusk:'Evening',night:'Night'}[m]+' in the village',artist:'Brösel',album:"Brösel's Gramophone",artwork:[{src:artwork(),sizes:'320x320',type:'image/png'}]}); }catch(e){}
  navigator.mediaSession.playbackState=on?'playing':'paused';
}
if('mediaSession' in navigator){
  navigator.mediaSession.setActionHandler('play',()=>start());
  navigator.mediaSession.setActionHandler('pause',()=>stop());
  try{ navigator.mediaSession.setActionHandler('nexttrack',()=>{ if(queue.length) playNext(); }); }catch(e){}
}

/* ---------- controls ---------- */
const playBtn=document.getElementById('play'), volEl=document.getElementById('vol'), nowEl=document.getElementById('now');
try{ const v=localStorage.getItem('broesel-gramophone-vol'); if(v!==null) volEl.value=v; }catch(e){}
vol=volEl.value/100;
audio.volume=.5; nativeVolume=Math.abs(audio.volume-.5)<.01;     // iPhones ignore page volume: use the buttons there
if(nativeVolume) audio.volume=vol; else { document.getElementById('volWrap').hidden=true; document.getElementById('volHint').hidden=false; }
playBtn.onclick=()=>on?stop():start();
volEl.oninput=()=>{ vol=volEl.value/100; if(nativeVolume) audio.volume=vol; try{ localStorage.setItem('broesel-gramophone-vol',volEl.value); }catch(e){} };
document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{ if(choice===b.dataset.mood) return; choice=b.dataset.mood;
  document.querySelectorAll('.seg button').forEach(x=>x.setAttribute('aria-pressed',x===b)); restartComposition(); ui(); });
const NAMES={day:'a sunny day tune',dusk:'a slow evening tune',night:'a quiet night tune'};
function playingMood(){ if(!current) return choice==='auto'?moodAt(new Date()):choice; const t=audio.currentTime; let m=current.moods[0]?.mood; for(const x of current.moods) if(x.t<=t) m=x.mood; return m||'day'; }
let lastUi='';
function ui(){ playBtn.textContent=on?'■ Stop':'▶ Play'; playBtn.setAttribute('aria-pressed',on);
  const txt=(on?(current?'Playing ':'Tuning up… '):'Ready: ')+NAMES[playingMood()]+(choice==='auto'?' (follows your clock)':'')+'.';
  if(txt!==lastUi){ nowEl.textContent=txt; lastUi=txt; mediaSession(); } }
setInterval(ui,1500); ui();
fill();   // compose the first bit right away so Play starts instantly
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ fill(); ui(); } });

/* ---------- pixel scene: Brösel and his gramophone ---------- */
const cv=document.getElementById('scene'), g=cv.getContext('2d');
const SKY={day:['#9fd3ea','#cfeaf2'],dusk:['#e9a07a','#f6d1a0'],night:['#1d2540','#33406a']};
const notes=[]; let seen=0;
function px(x,y,w,h,c){ g.fillStyle=c; g.fillRect(Math.round(x),Math.round(y),w,h); }
function paint(now,m,playing){
  const [a,b]=SKY[m];
  px(0,0,160,31,a); px(0,31,160,31,b);
  if(m==='night'){ for(let i=0;i<22;i++) px(rnd('s'+i)*160|0,rnd('t'+i)*44|0,1,1,(Math.floor(now/600+i)%5)?'#e8e6d0':'#8890b0'); px(128,10,7,7,'#f2ecc8'); px(131,8,6,7,SKY.night[0]); }
  else px(m==='day'?126:22,m==='day'?10:30,9,9,m==='day'?'#ffe58a':'#ffb46a');
  px(0,52,160,10,m==='night'?'#26334f':'#7fb36b'); px(0,62,160,28,m==='night'?'#1c2a3a':'#5f9a52');
  for(let x=0;x<160;x+=6) px(x,61,3,1,m==='night'?'#2c3c56':'#86c070');
  px(60,66,40,4,'#7a5236'); px(64,70,4,14,'#5d3e29'); px(92,70,4,14,'#5d3e29');
  px(66,58,26,8,'#9b6a43'); px(66,58,26,1,'#b98457'); px(68,56,22,2,'#3b2a20');
  const spin=playing?Math.floor(now/120)%2:0; px(76+spin*3,56,2,1,'#c9b18a');
  px(84,48,3,9,'#c79a3c'); px(86,40,4,9,'#d8ae4c'); px(89,32,6,10,'#e3bd5c'); px(94,28,10,14,'#efcd6e'); px(96,31,6,8,'#b88a2e');
  const nod=playing&&(Math.floor(now/(60000/BPM[m]))%2)?1:0, hx=34, hy=70+nod;
  px(hx,hy-6,18,10,'#7a5236'); for(let i=0;i<5;i++) px(hx+1+i*3,hy-8,2,2,'#3b2a20');
  px(hx+12,hy-3,8,7,'#d9b48a'); px(hx+19,hy,2,2,'#151515'); px(hx+15,hy-1,1,1,'#111'); px(hx+3,hy+4,3,2,'#4a3426'); px(hx+11,hy+4,3,2,'#4a3426');
}
function draw(now){
  const playing=on&&current&&!audio.paused, m=playingMood();
  paint(now,m,playing);
  if(playing){ const t=audio.currentTime; if(t<(current.events[seen-1]?.t??-1)) seen=0;
    while(seen<current.events.length&&current.events[seen].t<=t){ const e=current.events[seen++]; if(t-e.t<.3) notes.push({x:99+(e.m%5)*2,y:26,t:now,c:['#ffffff','#fff2b8','#ffd6e0'][e.m%3],dx:(rnd('d'+e.m+now)-.5)*.4}); } }
  for(let i=notes.length-1;i>=0;i--){ const n=notes[i], age=(now-n.t)/1000; if(age>3){ notes.splice(i,1); continue; }
    const x=n.x+Math.sin(age*3)*3+n.dx*age*20, y=n.y-age*9; g.globalAlpha=Math.max(0,1-age/3);
    px(x,y+4,2,2,n.c); px(x+1,y-1,1,5,n.c); px(x+2,y-1,2,1,n.c); g.globalAlpha=1; }
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
function artwork(){ const c=document.createElement('canvas'); c.width=c.height=320; const x=c.getContext('2d'); x.imageSmoothingEnabled=false; x.drawImage(cv,25,0,90,90,0,0,320,320); try{ return c.toDataURL('image/png'); }catch(e){ return ''; } }
</script>
</body>
</html>
